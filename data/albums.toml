[[entries]]
title = "Blackstar"
artist = "David Bowie"
type = "album"
genres = ["art rock", "experimental"]
year = 2016
spotify = "https://open.spotify.com/album/0vxg8oJKDu3i0bXQu7vEpi"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_k39UwBu5UuS2wsttD0xs2lWaVhJKlX538&si=Ue2qWvHzJRnlZuN2"
thought = "If I look at my listening habits, David Bowie was always a constant (top 3 artists). This is his final album. The terminal work. A beautiful way to exit. It feels deliberate, lucid, and unsentimental. Few artists have managed to turn farewell into form with such 'composure'. And let's be honest, 'composure' was not something he was lacking as an artist. Putting his death aside, from a production perspective, this is IMHO his best album, at least the one that resonates best with me and with the spiders from Mars."

[[entries]]
title = "1492: Conquest of Paradise"
artist = "Vangelis"
type = "album"
genres = ["instrumental", "electronic"]
year = 1992
spotify = "https://open.spotify.com/album/1Bof5WLdaxLYn3owI7CCx0?si=-QbDALULSHWHjlsg6mG0-w"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_l4hAugRxB-rwWFQ6Acdf4NgfHkn8SuYpE&si=RnPv4Llp0AKCSsSv"
thought = "As a kid, I had a big collection of cassettes (thanks, dad!). When my father brought me this album, I remember the badass cover: a solitary figure standing on a tall cliff. The music was unlike anything I was used to at that point in my life, but the taste was acquired fast. It felt different from everything else I was listening to back then. I became a fan almost instantly."


[[entries]]
title = "777 – Cosmosophy"
artist = "Blut Aus Nord"
type = "album"
genres = ["black metal", "avant-garde metal"]
year = 2012
spotify = "https://open.spotify.com/album/6hCtkhHQEQdboBgJmpBuhi"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nVJzKv1dkMbs_sq3iQzk-UN9fVy16Zq5o"
thought = "Black metal is one of my musical guilty pleasures. I discovered the genre in high school, got addicted to it, and went through a long metalhead phase to the point where black metal was almost all I listened to... until it became boring. Then I (re)discovered other kinds of music, but the soft spot remained. A lot of black metal is repetitive and a bit artificial (sorry for saying that), but from time to time a band appears that knows how to turn repetition into something genuinely strange and new. This album is proof of that. It is still black metal, but not in a way that bores me; on the contrary, it keeps intriguing me."

[[entries]]
title = "Abraxas"
artist = "Santana"
type = "album"
genres = ["psychedelic rock"]
year = 1970
spotify = "https://open.spotify.com/album/1CHUXwuge9A7L2KiA3vnR6"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_mMc70EALz41n1lVTIOZS0E7_LFUS1050E&si=b11JTJOy7VpV_XRh"
thought = "My father first introduced me to Santana through Supernatural (1999). It was a good album, especially with all the collaborations, but I enjoyed tracks like 'El Farol' and 'The Calling' more than the obvious hits. So on one hand there was the more commercial Santana, and on the other there were those groovier, more adventurous songs that really stayed with me. That made me curious about the 'old' Santana, and I eventually found Abraxas. To me, this album is an absolute beast in terms of groove and intricacy. My favourite."


[[entries]]
title = "The Afterlife"
artist = "The Comet Is Coming"
type = "album"
genres = ["jazz", "nu jazz", "psychedelic"]
year = 2019
spotify = "https://open.spotify.com/album/6z4LSt5zwCXUFI9JKJMMl3"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_kSYmRCzQToWxVwhS6mDaWT2sXB9w3LmTg&si=tMXPisYag1h7QASA"
thought = "I have a complicated relationship with jazz. On one hand, 'classic' jazz does not always click with me; the taste simply cannot be acquired by force. On the other hand, newer, contemporary, and more experimental jazz acts not only resonate with me, but have become some of my daily drivers. This mini-album contains many of the things I like about jazz: how easily and naturally it can merge with electronica and psychedelic rock. A must-listen, even if you are not really a 'jazz' person."

[[entries]]
title = "Age of Aquarius"
artist = "Villagers of Ioannina City"
type = "album"
genres = ["psychedelic rock", "stoner rock"]
year = 2019
spotify = "https://open.spotify.com/album/6qvEBNlB4rS4trNxuP2gAe?si=rCOud1tiT0ednIRMfHjqtw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lKy-vBLebLixERfYeqCDuPEc15fu_GvOI&si=k8gLVRB_8lEagB-Z"
thought = "As a 'Balkaner', I have this odd regret that the progressive rock and psychedelic rock scene is not bigger in my part of the world. And it is a shame, because Balkan music can blend beautifully with progressive rock. Imagine the equivalent of Canterbury prog in the Balkans: tales of rogue shqiptarë or vlachs with a touch of magic, all turned into prog rock with Oriental influences. Well, this band and this album come very close to that. You will not find the album's underlying theme to be explicitly Balkan, but you can definitely feel the influence, especially in songs like 'Dance of Night', 'Arrival', and 'For the Innocent'. Approved!"

[[entries]]
title = "Alarm!"
artist = "Nordmann"
type = "album"
genres = ["nu jazz", "experimental", "jazz"]
year = 2018
spotify = "https://open.spotify.com/album/7s0QgmzGDGS35g4Q7mVkol?si=EogLMTZrRtywhxJUG5vqtw"
thought = "Not much to say about this album other than that it is experimental, jazzy, and 'rocky' (not sure the term exists, but it fits). The chaos is controlled, and the atmosphere invites contemplation. It is not something I listen to every day, because it requires a bit of intellectual engagement to be fully appreciated. I am not even sure this is their best album, but it is the one I return to most often. Also I love how this album ends, 'Nightwork' is great."

[[entries]]
title = "All Is Violent, All Is Bright"
artist = "God Is an Astronaut"
type = "album"
genres = ["post-rock"]
year = 2005
spotify = "https://open.spotify.com/album/1FNW2D6cUdpOWnV38xuGIT?si=93vcubhQT36ncWPJk0K2OA"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_k3wiPBYG2LWCJfNe8CMXADOoHw3rHFP1Q&si=KQ--R0jeZf0rfdom"
thought = "Let me begin by saying that I do not like the band's name. Being an astronaut involves too much motion to attribute it to the type of god I might like. Edgy jokes aside, this album is a perfect gateway into post-rock. For me, it certainly was. The titles of the songs are excellent, and their order seems to hint at something larger. I like that."

[[entries]]
title = "Amenințarea Maimuței"
artist = "Kazi Ploae & Specii"
type = "album"
genres = ["hip hop", "experimental"]
year = 2009
spotify = "https://open.spotify.com/album/2frQMTiAULPkX6xqWxZT8i?si=5CrLlvciR3-Dt0NBvyULIg"
thought = "Around 2007-2009, the Romanian rap and hip-hop scene felt extremely boring, and then you had this."

[[entries]]
title = "The Angel and the Dark River"
artist = "My Dying Bride"
type = "album"
genres = ["doom metal", "gothic metal"]
year = 1995
spotify = "https://open.spotify.com/album/7lPBSJlgg96SWGOOCNqPLv?si=9qlPvT5eRj6kQhO1xoFXXQ"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_mM6MAQx68gHi_XF6TOZ68lx_SazY-vuaw&si=694oVoflVxQUOxVG"
thought = "I discovered this band and album when I was mostly into black metal, so this was the 'chiller' music I got hooked on. The album is foundational for the genre, but at the same time it is not an easy listen. The songs are slow, dirge-like, and demand patience, but they reward the listener with emotion and tension. One thing I noticed is that whenever I listen to it attentively, it leaves me exhausted by the end. I suppose that is by design."

[[entries]]
title = "Apatride"
artist = "André Manoukian"
type = "album"
genres = ["jazz"]
year = 2017
spotify = "https://open.spotify.com/album/1qqYZ5NnsfwqLIZVOjeerP?si=iN9pe-ROStmtxOudIYOKLg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_kad_cBBRzS1ccQszPo-rjPLaNruFt9f5c&si=DJBrhfMWkL__Bt-y"
thought = "As the name suggests, Manoukian is of Armenian heritage. This album, whose title translates to 'Stateless', seems to mark a turning point in the way he understands himself: an Armenian living as a Frenchman, torn between his Eastern roots and the adopted Western life he inhabits. As a 'Balkaner', I naturally appreciate the Eastern themes. They run deep here, and they bring warmth with them. The standaout moment of the album is the track 'Lili Aman'. For a Romanian like me it sounds vaguely 'familiar'."

[[entries]]
title = "Archipelago"
artist = "Hidden Orchestra"
type = "album"
genres = ["nu jazz", "experimental"]
year = 2012
spotify = "https://open.spotify.com/album/05EKAh2enH4uuFwDmVcbKG?si=RZ3_3QL6S1udH53rYZS4uA"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nzDVypMiUdJi46M4a21u_kQJ6BlvMCo2k&si=HYw5p4h49qKlyRbN"
thought = "Hidden Orchestra is not an orchestra in the traditional sense. Joe Acheson works more like a composer, producer, and assembler. He records a wide variety of guest musicians playing classical and traditional instruments, often in isolation, then takes those recordings, reshapes them, and builds an 'imaginary orchestra' that sounds more than cohesive. The results are often magical. This is my favourite work of his so far, but all the music he makes is surprising, original, and not exactly simple."

[[entries]]
title = "Asfalt"
artist = "Luna Amară"
type = "album"
genres = ["alternative rock", "grunge"]
year = 2004
spotify = "https://open.spotify.com/album/3Xj49ZFdi2h2s9HVMAoRJ1?si=7nhG-ks2QMenpDJ7TyurJg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_k_d0EX8FGLkltuK3h4wR-XQGr3fv8WWMc&si=SGOFKDvRzKOQDdg5"
thought = "Altough a metalhead, this album was one of highschool 'grunge crushes'. Also the lyrics resonated deeply with the times my generation had to live: the end of the transition years in Romania. The music is good, but the lyrics are the 'extra-spice' that gives this album its power. If you don't speak Romanian, a translation maybe won't suffice, but it will surely help to appreciate this work."

[[entries]]
title = "The Atlantic Years"
artist = "Jean-Luc Ponty"
type = "album"
genres = ["jazz", "progressive rock"]
year = 2011
spotify = "https://open.spotify.com/album/121DgEJGVSSKe2NRsBMNcm?si=NwJONxsdT5aMI6lJN3MxqA"
thought = "First, Ponty is widely recognized as one of the pioneers of the electric violin in modern music. Second, if you like progressive rock, it is hard not to like him. Third, if you like violins, it is almost impossible not to like him. Finally, this is a compilation of some of his best work from his most productive years. A must-listen."

[[entries]]
title = "At the Center of All Infinity"
artist = "Yuri Gagarin (SWE)"
type = "album"
genres = ["psychedelic rock", "space rock"]
year = 2015
spotify = "https://open.spotify.com/album/4YvmdztNoSV9WNcIJIExTq?si=fIUvGJN5QrakvLHabJKUfw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lit05v9bZ2-_ZazYya55-PFnKkEGoMYnI"
thought = "At first, the music may feel wild, unpolished, and heavily improvised. But if you listen more closely, there is a deliberate structure to these soundscapes. This is not a particularly well-known album, but to be honest, it is one of my contemporary favourites."

[[entries]]
title = "Back to Earth"
artist = "Exxasens"
type = "album"
genres = ["post-rock", "space rock"]
year = 2015
spotify = "https://open.spotify.com/album/4JGTO0GQsxsf66kKNgvq7M?si=N_Nw-dEUS6eO_rF9GFCG_g"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nyZooeOuI3zGFPXJFo2FZ7RT_cUwUA-fU&si=9eeg3EA4pEEEDxxq"
thought = "My hands are planets. It is a massive mix of heavy metal (maybe?) and atmospheric space rock. The whole thing mostly plays out like a sci-fi movie soundtrack, packed with spacey guitars, driving beats, and huge synths."

[[entries]]
title = "Between Flesh and Divine"
artist = "Asia Minor"
type = "album"
genres = ["progressive rock"]
year = 1981
spotify = "https://open.spotify.com/album/7Maqt0Hjfw1VUxXJpab4OX?si=gcOwPSxZQ9ScYUSOThV4Yw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_kg1Efm9wfcit9M_npk3TEczzAPvXPrI7g&si=8evWKrQPo9pFN1ex"
thought = "As I said earlier, I would like to have an equivalent to the Cantebury rock scene, but with a Balkan touch. This album is closer to that, more than others that I like."

[[entries]]
title = "Black Sun"
artist = "Kode9"
type = "album"
genres = ["electronic", "dubstep", "experimental"]
year = 2011
spotify = "https://open.spotify.com/album/5XDZiYWV346odjD73r1gzD?si=_nVKjR6VQdKhaosM8lEP2A"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lXakrQDwWOtfh-GZ1wmkT5prdZOrJM8n0&si=hYLabMC-MPAzcEpQ"
thought = "This album felt quite revolutionary to me in 2011. By then I was no longer really a metalhead, so I was already experimenting with different kinds of music. To be honest, I was first attracted by the title. It was not necessarily what I expected, but I gradually came to appreciate it."

[[entries]]
title = "Captured Spirits"
artist = "Mammal Hands"
type = "album"
genres = ["jazz", "nu jazz"]
year = 2020
spotify = "https://open.spotify.com/album/3C69O5UprPEvhb9YVrPVFz?si=xiIjXIqvQ-aGiqC68x2iSw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lex32vvjLe4wjuVlXEwkc0eI3hMVhZf-8&si=S-auvgFADEL5Oj5Q"
thought = "It's amazing what the mammal hands can do. This is the type of Jazz I like and I could listen over and over all day without getting bored or exhausted from it."

[[entries]]
title = "Caravana PM-AM"
artist = "Norzeatic"
type = "album"
genres = ["hip hop"]
year = 2012
spotify = "hhttps://open.spotify.com/album/0h5thgJJ6WASX7Qejdtqpp?si=sraLpJdPSxa22l2L4nCSDA"
thought = "I am not a big fan of international rap, or of rap in languages other than my own. But Norzeatic, or Vexxatu' Vexx, or Geamite Galigan, is an exception. I have liked him since the collaboration with Deceneu. I consider him the Romanian GOAT, and I am not alone in that. Unfortunately, most of us who believe this do not normally listen to rap. This is one of his best works. It is funky, highly lyrical, funny, spiritual, and full of the things I would like to see more often in this genre."

[[entries]]
title = "Ceremony of Opposites"
artist = "Samael"
type = "album"
genres = ["black metal", "industrial"]
year = 1994
spotify = "https://open.spotify.com/album/3Hyymxt8gzgFVHm8LVhYyi?si=b3RWE38wR9unf2mqHfqi3w"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_mbmSAfOrtmM6fQeP6Ey4FVd473gsWDmlc"
thought = "This is a transition album, moving from a raw, distorted sound toward something cleaner, more melodic, more keyboard-infused, and perhaps a little industrial. The lyrics are not really for me, but the music made me happy at a time when I was deeply into this kind of sound. I would not listen to it daily, or even weekly, but it remains a good nostalgic listen once every six months or once a year."

[[entries]]
title = "Cosmology"
artist = "Kotebel"
type = "album"
genres = ["progressive rock"]
year = 2017
spotify = "https://open.spotify.com/album/4fRPUSsBsUaZzdeMlaHPyI?si=2fSlVB5WSGW-LREtNBbwDQ"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lg7vx-lSp13c3Lt2GsADD_qIUbHfQFJlI&si=r0Gkw6NCIqLX0lsy"
thought = "This is one of those albums that remind me why progressive rock still has room to surprise me. It is intricate without becoming sterile (too technical), ambitious (they want to say something) without losing its sense of wonder (that i don't get). The whole thing feels like a patient construction, as if the music is trying to map a universe rather than simply impress the listener. Not an easy album, but a very rewarding one. Also, as with all music albums that have 'Cosmos', 'Planets' or 'Stars' in the title, it's an instant win for me."


[[entries]]
title = "Cypress Ave."
artist = "The Midnight Ghost Train"
type = "album"
genres = ["stoner rock"]
year = 2017
spotify = "https://open.spotify.com/album/6gr6iiHjSO2xClaSxmUjIt?si=fCISQZqxS16DDTZvUwgxXA"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nsKCYCC312XAuAQUAqwUK2Q91ti6cQ6CI&si=aILFbAJr_qeyHJgJ"
thought = "This is the kind of album I would have obsessively replayed during my heavier phases, and to be honest, a part of me still does (especially when I am stuck in Bucharest traffic). It has that rough, driving energy that makes everything feel a little more alive, a little less polished, a little more honest. I would not call it brilliant, but that is exactly why it works."

[[entries]]
title = "The Division Bell"
artist = "Pink Floyd"
type = "album"
genres = ["progressive rock"]
year = 1994
spotify = "https://open.spotify.com/album/5F0IQXuHfTV7SBvZVnXERl?si=PEj8aSwhQGeSMQ1UnjxBqQ"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nM82AUr-l5OxTITeZBbC6MqZpk9JxD_OE&si=qDek51HQnVymWyr8"
thought = "My favourite album of theirs. After all those years I can still listen to it without fatigue."

[[entries]]
title = "Dreams"
artist = "Gábor Szabó"
type = "album"
genres = ["jazz", "psychedelic"]
year = 1968
spotify = "https://open.spotify.com/album/2hEAqsjQtcgTxP4EF69Z4q?si=UCHSnqqDQJS-gDFLEODtsg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lkzrHWIvU6TExuvcSP-VkQ-W1-NM8-7Ic&si=Zk0nKgZyF8HnIoR4"
thought = "Going to sleep? If I want to listen to something before bed, this is one of my first picks. It resonates with my pre-sleep brain mode better than most albums. It's calm enough to calm me, but intricate enough to keep my synapses interested. </edgy joke> I don't participate in feelings when I listen to this kind of music."

[[entries]]
title = "Eat the Elephant"
artist = "A Perfect Circle"
type = "album"
genres = ["alternative rock", "art rock"]
year = 2018
spotify = "https://open.spotify.com/album/3Jr1RhAyndBxtyi8rJs3Op?si=R8IcpVKRTwSzhS2owwltUg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nM5FWR-VXWkRNrsU_XEPQLFP7gmh-dyVs&si=r6ZZk-06l5ljddCl"
thought = "This is a restrained album, almost suspiciously restrained for A Perfect Circle, and that is precisely why I like it. Delicious, the elephant, yes, but in a way that leaves an aftertaste, an acquired aftertaste."

[[entries]]
title = "Flowers from Exile"
artist = "Rome"
type = "album"
genres = ["neofolk"]
year = 2009
spotify = "https://open.spotify.com/album/7szbWc8zh1MwmkptbNVwM7?si=ZZQZab8LS3WaNmUtGocLmA"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_k1WTDsD1f-3EGg23fk00llzZcq0PWQW0o&si=geAVF5PDKkvEGRGG"
thought = "I return to it when I want music that sounds haunted, but still composed. I also enjoy the oratorical quality of the vocals: like a philosopher preaching, or debating, in a crowded plaza in ancient Rome."

[[entries]]
title = "Geometria"
artist = "Thy Catafalque"
type = "album"
genres = ["avant-garde metal", "experimental"]
year = 2018
spotify = "https://open.spotify.com/album/76bSrJSE20rbODR36eSEQE?si=xazR5vwMSS-fh2yvVDIMsw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nPpPx0tDlgEFaY4iYXPn-skJdzZOvzy3M&si=SZxisq6fufKBB67K"
thought = "The album title works like a magnet. Then there are the hidden themes, which sound familiar and make me happy, especially when they appear in music that, in its most natural form, feels quite remote from the culture and sounds associated with my own corner of the world."

[[entries]]
title = "Hadal Sherpa"
artist = "Hadal Sherpa"
type = "album"
genres = ["post-rock"]
year = 2017
spotify = "https://open.spotify.com/album/6Rk5ko5eaI3loJBDBFF38g?si=ZsU1RYxRSBagnH4Qku-zZQ"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_l96UaMHcExceTd33RwUks-py495KBPf4I&si=qXb5HM00V0s99fZF"
thought = "Albums that share the band's name are usually good. I know at least one that is brilliant. As for this one, imagine a sherpa walking beside you, not without some payment on your side, guiding you through quite a journey. If you are already a fan of this kind of music, you should definitely try it. If not, there are better gateways, but even so, it is still worth trying."

[[entries]]
title = "Hall of the Mountain Grill"
artist = "Hawkwind"
type = "album"
genres = ["space rock", "psychedelic"]
year = 1974
spotify = "https://open.spotify.com/album/..."
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_..."
thought = "Hawkwind is to space rock what Johnny Cash is to country."

[[entries]]
title = "Heir to Despair"
artist = "Sigh"
type = "album"
genres = ["avant-garde metal", "black metal"]
year = 2018
spotify = "https://open.spotify.com/album/2upGyOFfzDyAFptPpDsZNF?si=sn6twsGEQdesy4PypUAtyg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_l8Kr7zKJ3SgZI86R-zcvELv_3mIwCkr7k&si=Xz92G-Ku6j5TSkaG"
thought = "Calling this a black metal album feels a little limiting. Imagine the Moulin Rouge hosting a black-market cabaret banquet: this is the band they would invite to play. In the absence of a better comparison, please accept this one with a smile."

[[entries]]
title = "In the Passing Light of Day"
artist = "Pain of Salvation"
type = "album"
genres = ["progressive metal"]
year = 2017
spotify = "https://open.spotify.com/album/3p3jOZI2RjHPVpu7kfgjOB?si=iTgKb3jxTPStGDGzCuyBpw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_llI_az25fV7NRaTreWIqjpBDSTesN3jBA&si=dM_dDWSNLE0P59gA"
thought = "There is not much I can say about this, except that I like it a lot, despite not being a huge fan of either the genre or the band."

[[entries]]
title = "King for a Day... Fool for a Lifetime"
artist = "Faith No More"
type = "album"
genres = ["alternative rock", "experimental"]
year = 1995
spotify = "https://open.spotify.com/album/198GsVgwHgoas39b8TcPYp?si=jfPSWYSEQFSZ4Zd0RigIpg"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_nY01Owhy867C4oAeSHjxBOV7C2C97lxuw&si=r44HlGqJ21w6kWyA"
thought = "In high school I had a friend a little older than me who went to university in another town. There he met a guy who played in a grindcore band (he was actually his roomate). So, I asked my friend to ask that guy to burn me some CDs with the music he had. During summer break, my friend came back home with 10 CDs. Nine of them contained the most insane death metal and grindcore albums, and one disc was the 'chill' one. It had Faith No More and other such softies. That is how I discovered this album, which I otherwise would have ignored."

[[entries]]
title = "Lateralus"
artist = "Tool"
type = "album"
genres = ["progressive metal"]
year = 2001
spotify = "https://open.spotify.com/album/5l5m1hnH4punS1GQXgEi3T?si=3wOUdj-9RFGGC72Mp8QYNw"
youtube = "https://music.youtube.com/playlist?list=OLAK5uy_lA0kWh6Mkkj3mZhzV0vJ429vsjwmBzF_Y"
thought = "A classic."

[[entries]]
title = "Let My People Go"
artist = "Darondo"
type = "album"
genres = ["soul", "funk"]
